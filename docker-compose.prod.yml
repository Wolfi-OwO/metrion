# Production database stack for the Contabo VPS (<VPS-IP>). Run with:
#   docker compose -f docker-compose.prod.yml up -d
#
# This file owns the database and the ingest API (metrion-ingest, moved here
# from Azure Container Apps so ingest reaches the db over the local bridge
# instead of the SSH tunnel). metrion-viewer still runs on Azure Container Apps
# (see organizational/agent-deployment-runbook.md) - see ADR 0004's Hosting
# section for why the database itself is self-hosted here instead of managed
# Azure Postgres.
#
# ── How this differs from docker-compose.dev.yml ────────────────────────────
#   * TLS is mandatory (ssl=on, TLSv1.2 minimum, hostssl-only in pg_hba.conf,
#     set up by db/init/10-tls-hba.sh on first init - see that file). Local
#     dev never needed a certificate; a database reachable from the public
#     internet does.
#   * The port is bound to loopback only (127.0.0.1:5432:5432), not published
#     to the world - Container Apps never talks to this port directly, it
#     goes through the db-tunnel sidecar's SSH forward, which lands on
#     127.0.0.1:5432 as seen from the VPS's own side, same as any other
#     local client. Publishing to 0.0.0.0 bought nothing real: ufw was doing
#     all the actual restricting anyway, so this makes that the only
#     control, not the sole one standing between Postgres and the internet.
#   * The password comes from a repo-root .env (gitignored, scp'd separately,
#     chmod 600 on the server, POSTGRES_PASSWORD=...) - never committed.
#
services:
  db:
    # Same pinned tag as docker-compose.dev.yml and ADR 0004 - never `:latest`.
    image: timescale/timescaledb-ha:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: metrion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: metrion
    # shared_buffers/work_mem left at the image's own defaults, per ADR 0004 -
    # no tuning until a real workload proves a default wrong.
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
      - -c
      - ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
      - -c
      - ssl_min_protocol_version=TLSv1.2
    volumes:
      - metrion-db-data:/home/postgres/pgdata/data
      # Runs once, only when the data directory is empty (the postgres image's
      # own first-init hook) - rewrites pg_hba.conf to hostssl-only,
      # scram-sha-256, no trust, no md5. Never touches an already-initialized
      # volume, so a restart or an image bump does not re-run it.
      - ./db/init/10-tls-hba.sh:/docker-entrypoint-initdb.d/10-tls-hba.sh:ro
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U metrion -d metrion']
      interval: 5s
      timeout: 5s
      retries: 10
    # A good citizen on a 4 vCPU / 8 GB VPS shared with five other stacks
    # (see /opt/preussen's docker-compose.prod.yml for the budget reasoning
    # this mirrors) - the same cap the sibling postgis-based nutrilens-db
    # container already runs under on this box.
    mem_limit: 512m

  ingest:
    image: globalcr01.azurecr.io/metrion-ingest:${INGEST_IMAGE_TAG:?INGEST_IMAGE_TAG must be set in .env}
    restart: unless-stopped
    mem_limit: 256m
    # No `ports:` on purpose: Caddy (/opt/portfolio) is the only container
    # allowed to publish host ports and reaches ingest as metrion-ingest-1:8090
    # over edge-net.
    depends_on:
      db:
        condition: service_healthy
    environment:
      # sslmode=require, not verify-full: db/init/10-tls-hba.sh serves the
      # snakeoil self-signed cert, which has no chain to verify. pg 8.x needs
      # uselibpqcompat=true for libpq semantics (require = encrypt, no verify).
      DATABASE_URL: postgres://metrion:${POSTGRES_PASSWORD}@db:5432/metrion?sslmode=require&uselibpqcompat=true
      NODE_ENV: production
      PORT: '8090'
    # Liveness touches no DB, so a green check does not prove the DSN works.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8090/api/v1/health/liveness').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - default
      - edge-net

networks:
  # Pinned so the DOCKER-USER ACCEPT in organizational/metrion-db-firewall/
  # apply-fw.sh (METRION_DB_BRIDGE_SUBNET in /opt/metrion/fw.env) has a stable
  # subnet; auto-assigned from a crowded pool (28 br-* bridges here) it could
  # drift. Keep both values identical.
  default:
    ipam:
      config:
        - subnet: 172.23.0.0/16
  # Created once on the host (`docker network create edge-net`), shared with
  # the portfolio Caddy - see /opt/portfolio/docker-compose.prod.yaml.
  edge-net:
    external: true

volumes:
  metrion-db-data:
