name: CI

on:
  push:
  pull_request:

# A second push to the same branch makes the first run's result irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    # Several test files (packages/db, applications/ingest,
    # applications/viewer) connect to a real Postgres at
    # postgres://metrion:metrion@localhost:5432/metrion - the same default
    # docker-compose.dev.yml gives a local `npm test` run. Found the hard
    # way on this job's first-ever real run: without a service container
    # here, those tests don't fail fast, they hang - `pg`'s connection
    # attempt against a port nothing is listening on did not get a fast
    # ECONNREFUSED on the runner, and stalled `npm test` for 15+ minutes
    # before being cancelled.
    services:
      db:
        image: timescale/timescaledb-ha:pg17
        env:
          POSTGRES_USER: metrion
          POSTGRES_PASSWORD: metrion
          POSTGRES_DB: metrion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metrion -d metrion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # Node 22: the viewer and the client both declare `engines.node >= 22`.
      # The root stays at >= 18.19 because the collector is deployed to an
      # Ubuntu 24.04 VPS whose Node comes from the distribution repositories -
      # CI running a newer runtime does not license raising that floor.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The same root scripts a developer runs locally, in the same order, so
      # a green CI run and a green working copy mean the same thing. CI does
      # not get its own parallel set of commands to drift from.
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

      # Builds every workspace, the client's Vite build included. Runs before
      # the tests because each workspace's `test` script compiles first
      # anyway - a build failure should read as a build failure.
      - run: npm run build

      # applications/ingest's and applications/viewer's tests query real
      # tables (users, api_keys, ...) against this job's db service - only
      # packages/db's own migrate.test.ts applies migrations itself, and
      # only against a throwaway fixture directory, never the real
      # packages/db/migrations. A fresh service container has neither, so
      # without this step those tests fail at setup with `relation "users"
      # does not exist` - and were then found to hang afterward rather than
      # exit cleanly, which is what the timeout below now guards against
      # either way.
      - name: Apply migrations to this job's own db service
        env:
          DATABASE_URL: postgres://metrion:metrion@localhost:5432/metrion
        run: npm run migrate --workspace @metrion/db

      # A hard ceiling in case a test ever again finds a way to hang instead
      # of failing fast - a red build in 10 minutes beats a silent stall.
      - run: npm test
        timeout-minutes: 10

  # Runs the real migration files against the exact image and tag the
  # production deploy uses (see docker-compose.prod.yml and ADR 0004).
  # `check`'s own tests/migrate.test.ts already covers the runner's logic
  # (idempotency, ordering) against its own Postgres service above; this
  # separate job is the one place that proves the SQL applies cleanly on a
  # freshly-initialized database with nothing else pre-seeded into it.
  migration-check:
    runs-on: ubuntu-latest

    services:
      db:
        image: timescale/timescaledb-ha:pg17
        env:
          POSTGRES_USER: metrion
          POSTGRES_PASSWORD: metrion
          POSTGRES_DB: metrion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metrion -d metrion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply every migration against a real timescaledb-ha:pg17
        env:
          DATABASE_URL: postgres://metrion:metrion@localhost:5432/metrion
        run: npm run migrate --workspace @metrion/db
