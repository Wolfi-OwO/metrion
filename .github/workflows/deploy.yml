name: Deploy

# Only after CI has passed on main. A deploy that races the test run would
# publish an image nobody has checked. Restored from the version Task 1's
# rename disabled (git history: 6054b8b) and extended to the two Metrion
# services - see organizational/agent-deployment-runbook.md for the infrastructure
# this deploys onto.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # A manual button, for redeploying the same commit after an infrastructure
  # change CI knows nothing about.
  workflow_dispatch:

# OIDC: GitHub mints a short-lived token that Azure trades for one of its
# own. There is no client secret stored in this repository - the
# `metrion-deploy` identity (in `metrion-rg`, replacing the old `mona-deploy`
# in the now-deleted `mona-rg` - see the viewer runbook's "Teardown, as
# actually executed" section) has two federated credentials, both trusting
# this repo on `main` only: one by name, one carrying GitHub's numeric
# owner/repo IDs (see the viewer runbook's note on why - that form already
# survives a repo rename).
permissions:
  contents: read
  id-token: write

# A second push while a deploy is running should win, not queue behind it,
# but never interrupt one mid-way: a half-migrated database or a
# half-updated revision is worse than a late one.
concurrency:
  group: deploy-metrion
  cancel-in-progress: false

env:
  REGISTRY: globalcr01.azurecr.io
  RESOURCE_GROUP: metrion-rg
  VPS_HOST: <VPS-IP>

jobs:
  # One explicit step, before either service's new revision goes out -
  # never from application startup. Ingest can be restarted while another
  # process is starting; two processes migrating the same database at once is a bug
  # class this project has hit before. Runs over SSH, not a direct Postgres
  # connection: GitHub-hosted runners have no stable egress IP, so
  # allowlisting them on the VPS firewall isn't workable (see the runbook's
  # own note on why the Container Apps side needed a tunnel for the same
  # reason).
  migrate:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build --workspace @metrion/db

      - name: Ship the migrator to the VPS and run it there
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.METRION_SSH_DEPLOY_KEY }}" > ~/.ssh/metrion_deploy_key
          chmod 600 ~/.ssh/metrion_deploy_key
          # Pinned, not ssh-keyscan'd: keyscan trusts on first use, silently,
          # on every single run - if the VPS were ever MITM'd between runs,
          # CI would just re-trust the new key and hand it the tarball
          # below. Captured once via `ssh-keyscan -t ed25519 <VPS-IP>`
          # and checked in literally, same fingerprint the db-tunnel sidecar
          # now pins (see infra/db-tunnel-sidecar/entrypoint.sh).
          echo "$VPS_HOST ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIL0EZSmAYeYlrrvypv8MGUoUHVyFlDnWFf6rDKQkdD2C" >> ~/.ssh/known_hosts

          tar czf /tmp/db-migrate.tar.gz -C packages/db dist migrations package.json

          # The CI key is now a forced-command key (see
          # organizational/agent-deployment-runbook.md and
          # /opt/metrion/deploy.sh on the VPS) - it ignores whatever we ask
          # it to run and always executes that one script, reading the
          # tarball off stdin. No `scp` step: modern OpenSSH `scp` defaults
          # to the SFTP protocol, which a forced command can't cleanly
          # single out without exec'ing a real sftp-server - piping over the
          # same session's stdin needs no such exception.
          ssh -i ~/.ssh/metrion_deploy_key "deploy@$VPS_HOST" < /tmp/db-migrate.tar.gz

  deploy:
    needs: migrate
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    strategy:
      # One matrix, both services - a deploy is a merge for either, not a
      # separately-remembered sequence per app.
      matrix:
        include:
          - app: metrion-ingest
            dir: applications/ingest
            dockerfile: applications/ingest/Dockerfile
            port: 8090
            target: vps
          - app: metrion-viewer
            dir: applications/viewer
            dockerfile: applications/viewer/Dockerfile
            port: 8080
            target: azure

    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The version in package.json is the image tag, so a deployed revision
      # can be traced back to a released version rather than to a commit sha
      # nobody can read. The run number keeps the suffix unique when the
      # same version is deployed twice.
      - name: Resolve version
        id: version
        run: |
          VERSION=$(node -p "require('./${{ matrix.dir }}/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "suffix=v${VERSION//./-}-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          # Immutable per-run tag: the VPS deploy needs a tag that can never
          # be overwritten, otherwise "roll back to the previous tag" would
          # roll back to whatever a later push of the same version left there.
          echo "vps_tag=$VERSION-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        run: |
          az acr login -n globalcr01
          # Built from the repository root: npm workspaces need the root
          # manifest and lockfile - same reason as every Dockerfile here.
          docker build -f "${{ matrix.dockerfile }}" \
            -t "$REGISTRY/${{ matrix.app }}:${{ steps.version.outputs.version }}" \
            -t "$REGISTRY/${{ matrix.app }}:latest" .
          docker push "$REGISTRY/${{ matrix.app }}:${{ steps.version.outputs.version }}"
          docker push "$REGISTRY/${{ matrix.app }}:latest"
          if [ "${{ matrix.target }}" = vps ]; then
            docker tag "$REGISTRY/${{ matrix.app }}:latest" "$REGISTRY/${{ matrix.app }}:${{ steps.version.outputs.vps_tag }}"
            docker push "$REGISTRY/${{ matrix.app }}:${{ steps.version.outputs.vps_tag }}"
          fi

      # `--container-name` matters here: both apps run a `db-tunnel` sidecar
      # (see infra/db-tunnel-sidecar and the runbook's Database
      # connectivity section) alongside the main container, named exactly
      # after the app. Omitting it targets an ambiguous/default container
      # and risks dropping the sidecar from the new revision - `--image`
      # alone (no `--yaml`) otherwise leaves every other container in the
      # template untouched.
      - name: Deploy revision
        if: matrix.target == 'azure'
        run: |
          az containerapp update -n "${{ matrix.app }}" -g "$RESOURCE_GROUP" \
            --container-name "${{ matrix.app }}" \
            --image "$REGISTRY/${{ matrix.app }}:${{ steps.version.outputs.version }}" \
            --revision-suffix "${{ steps.version.outputs.suffix }}"

      # `az containerapp update` returns while the previous revision is
      # still serving, so a check run immediately after it can pass against
      # the code that was just replaced. Wait for a single active revision
      # first - same trap the viewer's very first deploy hit.
      - name: Wait for the handover
        if: matrix.target == 'azure'
        run: |
          for _ in $(seq 1 60); do
            ACTIVE=$(az containerapp revision list -n "${{ matrix.app }}" -g "$RESOURCE_GROUP" \
              --query "length([?properties.active])" -o tsv)
            [ "$ACTIVE" = "1" ] && break
            sleep 10
          done

      # A deploy that finishes is not a deploy that works. Liveness only -
      # neither service has a separate readiness probe (both pools are lazy,
      # see applications/*/src/lib/db.ts), so liveness answering 200 is the
      # whole post-deploy check available today.
      - name: Verify the running app
        if: matrix.target == 'azure'
        run: |
          FQDN=$(az containerapp show -n "${{ matrix.app }}" -g "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          curl -fsS --max-time 60 -o /dev/null "https://$FQDN/api/v1/health/liveness"
          echo "https://$FQDN is live"

      # metrion-ingest runs on the VPS now. The same forced-command key as the
      # migrate job, but asking for `ingest <tag>` makes /opt/metrion/deploy.sh
      # pull the image, restart only the ingest container, prove a DB round
      # trip and roll back on failure - a non-zero exit here means it did.
      # The Azure metrion-ingest app no longer exists (deleted 2026-09-20,
      # ADR 0008); only the viewer is deployed to Azure.
      - name: Deploy to the VPS
        if: matrix.target == 'vps'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.METRION_SSH_DEPLOY_KEY }}" > ~/.ssh/metrion_deploy_key
          chmod 600 ~/.ssh/metrion_deploy_key
          # Same pinned host key as the migrate job.
          echo "$VPS_HOST ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIL0EZSmAYeYlrrvypv8MGUoUHVyFlDnWFf6rDKQkdD2C" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/metrion_deploy_key "deploy@$VPS_HOST" "ingest ${{ steps.version.outputs.vps_tag }}"

      # The gate inside deploy.sh only sees the container; this checks the
      # path users hit (Caddy -> ingest) and that the new code is really the
      # one answering (the public-status route 404s on older images).
      - name: Verify the public endpoint
        if: matrix.target == 'vps'
        run: |
          curl -fsS --max-time 60 "https://metrion-ingest.woofi-developments.at/api/v1/public/projects/86b02c8c-4357-4655-9835-1897787cdd9a/uptime" | head -c 200
