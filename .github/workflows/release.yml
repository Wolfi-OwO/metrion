name: Release

# A published GitHub Release starts a deploy; it then waits for the
# `production` environment's required reviewer, so nothing reaches the VPS
# without an explicit approval. Before this it deployed on every green push
# to main, with no gate and no way back. See
# organizational/agent-deployment-runbook.md for the infrastructure this
# deploys onto.
on:
  release:
    types: [published]
  # The manual button doubles as the rollback: run it with `ref` set to an
  # older release tag (for example v0.5.4) and `rollback` ticked. It rebuilds
  # that tag and redeploys it without touching the database, because
  # migrations only move forward.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Release tag (or branch) to deploy; empty means the branch the workflow was started from'
        required: false
        type: string
      rollback:
        description: 'Rolling back to an older version: skip the database migration'
        required: false
        default: false
        type: boolean

# OIDC: GitHub mints a short-lived token that Azure trades for one of its
# own. The deploy job runs in the `production` environment, so the token's
# subject is `...:environment:production`; the identity has federated
# credentials for that subject (and the older main-branch ones).
# There is no client secret stored in this repository - the
# `metrion-deploy` identity (in `metrion-rg`, replacing the old `mona-deploy`
# in the now-deleted `mona-rg` - see the viewer runbook's "Teardown, as
# actually executed" section) has federated credentials for the `main`
# branch and for the `production` environment, each once by name and once
# carrying GitHub's numeric owner/repo IDs (see the viewer runbook's note on
# why - that form already survives a repo rename).
permissions:
  contents: read
  id-token: write

# A second push while a deploy is running should win, not queue behind it,
# but never interrupt one mid-way: a half-migrated database or a
# half-updated revision is worse than a late one.
concurrency:
  group: deploy-metrion
  cancel-in-progress: false

env:
  REGISTRY: globalcr01.azurecr.io
  RESOURCE_GROUP: metrion-rg
  VPS_HOST: ${{ vars.VPS_HOST }}

jobs:
  # One job, one approval. A migrate job plus a deploy job would each stop at
  # the environment gate, so a release would need two clicks; the migration
  # therefore runs as the first step here, strictly before either service goes out.
  # `release` events only come from this repo's own maintainers, so unlike the
  # old workflow_run trigger there is no fork-PR path to guard against.
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install SSH key and pinned host key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.METRION_SSH_DEPLOY_KEY }}" > ~/.ssh/metrion_deploy_key
          chmod 600 ~/.ssh/metrion_deploy_key
          # Pinned, not ssh-keyscan'd: keyscan trusts on first use, silently,
          # on every single run - if the VPS were ever MITM'd between runs,
          # CI would just re-trust the new key and hand it the tarball
          # below. Captured once via `ssh-keyscan -t ed25519 <VPS-IP>`
          # and checked in literally, same fingerprint the db-tunnel sidecar
          # now pins (see infra/db-tunnel-sidecar/entrypoint.sh).
          echo "$VPS_HOST ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIL0EZSmAYeYlrrvypv8MGUoUHVyFlDnWFf6rDKQkdD2C" >> ~/.ssh/known_hosts

      # Never from application startup, and never while another process
      # migrates: two processes migrating the same database at once is a bug
      # class this project has hit before. Runs over SSH, not a direct
      # Postgres connection: GitHub-hosted runners have no stable egress IP.
      # Skipped on a rollback, because the old code must run on the newer schema.
      - name: Ship the migrator to the VPS and run it there
        if: ${{ !inputs.rollback }}
        run: |
          npm ci
          npm run build --workspace @metrion/db
          tar czf /tmp/db-migrate.tar.gz -C packages/db dist migrations package.json
          # The CI key is a forced-command key (see
          # /opt/metrion/deploy.sh on the VPS) - it ignores whatever we ask
          # it to run and always executes that one script, reading the
          # tarball off stdin. No `scp`: a forced command can't single out the
          # SFTP protocol without exec'ing a real sftp-server.
          ssh -i ~/.ssh/metrion_deploy_key "deploy@$VPS_HOST" < /tmp/db-migrate.tar.gz

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Ingest first, then the viewer, and a failure in either stops the run.
      # The version in package.json is the image tag, so a deployed revision
      # traces back to a released version rather than a commit sha. The run
      # number gives an immutable per-run tag: "roll back to the previous
      # tag" must not land on whatever a later push of the same version left.
      # Built from the repository root: npm workspaces need the root manifest
      # and lockfile - same reason as every Dockerfile here.
      - name: Build, push and deploy both services
        run: |
          set -euo pipefail
          az acr login -n globalcr01
          for svc in ingest viewer; do
            app="metrion-$svc"
            dir="applications/$svc"
            version=$(node -p "require('./$dir/package.json').version")
            vps_tag="$version-${{ github.run_number }}"

            docker build -f "$dir/Dockerfile" \
              -t "$REGISTRY/$app:$version" -t "$REGISTRY/$app:latest" .
            docker push "$REGISTRY/$app:$version"
            docker push "$REGISTRY/$app:latest"
            docker tag "$REGISTRY/$app:latest" "$REGISTRY/$app:$vps_tag"
            docker push "$REGISTRY/$app:$vps_tag"

            # The same forced-command key: asking for `ingest <tag>` or
            # `viewer <tag>` makes /opt/metrion/deploy.sh pull the image,
            # restart only that container, prove a DB round trip and roll back
            # on failure - a non-zero exit here means it did.
            ssh -i ~/.ssh/metrion_deploy_key "deploy@$VPS_HOST" "$svc $vps_tag"
            echo "- \`$app\` $vps_tag" >> deployed.txt
          done

      # The gate inside deploy.sh only sees the container; this checks the
      # path users hit (Caddy -> service) and that the new code is really the
      # one answering (the public-status route 404s on older images).
      - name: Verify the public endpoints
        run: |
          curl -fsS --max-time 60 "https://metrion-ingest.woofi-developments.at/api/v1/public/projects/86b02c8c-4357-4655-9835-1897787cdd9a/uptime" | head -c 200
          echo
          curl -fsS --max-time 60 -o /dev/null "https://metrion.woofi-developments.at/api/v1/health/liveness"
          echo "https://metrion.woofi-developments.at is live"

      - name: Summary
        if: success()
        run: |
          {
            echo "### Deployed ${{ inputs.ref || github.event.release.tag_name || github.ref_name }}${{ inputs.rollback && ' (rollback)' || '' }}"
            echo ""
            cat deployed.txt
            echo ""
            echo "To go back: run this workflow with \`ref\` set to an older release tag and \`rollback\` ticked."
          } >> "$GITHUB_STEP_SUMMARY"
